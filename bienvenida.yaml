# Bienvenida por voz en el Google Home de la sala cuando alguien llega a casa.
- id: bienvenida_casa
  alias: "Casa: bienvenida al llegar"
  mode: queued
  triggers:
    - trigger: state
      entity_id: person.otniel_gomez     # agrega aquí a tu esposa cuando tenga su persona
      to: "home"
  conditions:
    - condition: template                # que sí haya salido más de 10 min (no un salto de GPS)
      value_template: >
        {{ trigger.from_state.state not in ['home','unknown','unavailable']
           and (now() - trigger.from_state.last_changed).total_seconds() > 600 }}
    - condition: time                    # no despertar a nadie
      after: "07:00:00"
      before: "22:30:00"
  actions:
    - delay: >                          # da tiempo de abrir la puerta (sin espera al probar a mano)
        {{ '00:00:20' if trigger is defined and trigger.platform == 'state' else '00:00:00' }}
    - action: tts.speak
      target:
        entity_id: tts.sala_google_translate_es_com_mx
      data:
        media_player_entity_id: media_player.sala
        message: >
          {% set h = now().hour %}
          {{ 'Buenos días' if h < 12 else 'Buenas tardes' if h < 19 else 'Buenas noches' }},
          {{ (trigger.to_state.name if trigger is defined and trigger.to_state is defined else state_attr('person.otniel_gomez','friendly_name') or 'Otniel').split(' ')[0] }}. Bienvenido a casa.
